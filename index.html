    <script>
      // Early-stage script error interceptor to handle cross-origin "Script error." and unhandled promise/API rejections silently
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('Script error') || event.message.includes('Script error.'))) {
          console.warn('[NSN969 Early Guard] Silenced cross-origin script error:', event.message);
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, { capture: true });
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('[NSN969 Early Guard] Silenced unhandled rejection:', event.reason);
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }, { capture: true });
    </script>

  </head>
